{% comment %}
	Site header: text wordmark plus the navigation menu from jekyll-menus.
	Person pages mark People as current.
{% endcomment %}

<header class="site-header">
	<div class="container">
		<a class="wordmark" href="{{ "/" | absolute_url }}">{{ site.title }}</a>
		<nav class="site-nav" aria-label="Main">
			{% for link in site.menus.navigation %}
			<a href="{{ link.url | absolute_url }}"{% if page.url == link.url or page.collection == "people" and link.identifier == "_people" %} aria-current="page"{% endif %}>{{ link.title }}</a>
			{% endfor %}
		</nav>
	</div>
</header>
